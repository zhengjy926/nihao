#
# Application-level configuration. Board facts (clocks, GPIO, pinctrl, serial)
# belong in the board defconfig; everything chosen by the application lives
# here.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_LOG_LEVEL_OFF=y
CONFIG_LOG_PRINTK=n

# Logs go out over SEGGER RTT, never over a serial port. There is no console:
# the only UART on this board is the application's data port, and nothing else
# may write to it.
CONFIG_LOG_BACKEND_RTT=y
# Drop when the host is not reading: a log line must never block the main loop
# or wait for a debugger. 256 B is one whole RTT line; the 128 B default would
# silently truncate the per-second "alive" line once its counters widen.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n

CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y

CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_ASSERT=n
CONFIG_PM=n
