#
# Application-level configuration. Board facts (clocks, GPIO, pinctrl, serial)
# belong in the board defconfig; everything chosen by the application lives
# here.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_LOG_LEVEL_OFF=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y

CONFIG_ASSERT=n
CONFIG_PM=n
